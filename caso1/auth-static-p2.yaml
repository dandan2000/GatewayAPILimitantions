apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: auth-static-p2
spec:
  rules:
    authentication:
      api-key-authn-54a5ff77:
        apiKey:
          allNamespaces: true
          selector:
            matchLabels:
              application_id: 731b0759
              key-type: app-key
              product: l2
        credentials:
          customHeader:
            name: app_key
        metrics: false
        priority: 0
    authorization:
      require-app-id-p2:
        metrics: false
        patternMatching:
          patterns:
          - operator: eq
            selector: request.headers.app_id
            value: 731b0759
        priority: 0
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: fake-api
